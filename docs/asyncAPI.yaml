asyncapi: 3.1.0

info:
  title: FutBot - Especificación de los canales WebSocket de la API de FutBot
  version: 2.0.0
  description: |
    Se definen los eventos que el servidor empuja al cliente en tiempo real durante un partido (estado de jugadores y la pelota, goles, pausas, sustituciones, penales, fin de partido), en el lobby de ligas y amistosos, y en las notificaciones del club. Todos los mensajes se envían envueltos en un sobre con dos campos, `type` (el nombre del evento) y `data` (la información del evento).

    **Autenticación.** Todos los canales requieren el mismo JWT que devuelve `POST /auth/login`, enviado en la query string: `ws://localhost:8000/ws/matches/{match_id}?token=<JWT>` (el `WebSocket` del navegador no permite mandar el header `Authorization`). Si falta o es inválido, el servidor cierra la conexión con el código `4401`.

    **Estado al conectarse.** En `matchStream` y `friendlyLobbyStream`, al abrir una conexión el servidor le envía a ese cliente (no a todos) los mensajes necesarios para conocer el estado actual del canal. En `leagueLobbyStream` y `notificationStream` el estado se pide por REST y el canal solo avisa las novedades.

servers:
  development:
    host: 'localhost:8000'
    protocol: ws
    security:
      - $ref: '#/components/securitySchemes/queryToken'

channels:
  leagueLobbyStream:
    address: '/ws/leagues/{league_id}/lobby'
    description: |
      Eventos de una liga, mientras espera para arrancar y mientras se juega.

      El canal no manda estado al conectarse: el detalle, el fixture y la tabla se piden con `GET /leagues/{league_id}`, `GET /leagues/{league_id}/matches` y `GET /leagues/{league_id}/standings`. Con la liga en curso, ante cada `leagueUpdated` el frontend vuelve a pedirlos.

      Si la liga no existe o está cancelada, el servidor cierra la conexión con el código `4404`.
    parameters:
      league_id:
        description: ID único de la liga.
    messages:
      clubRegistered:
        $ref: '#/components/messages/ClubRegistered'
      clubLeft:
        $ref: '#/components/messages/ClubLeft'
      leagueStarted:
        $ref: '#/components/messages/LeagueStarted'
      leagueCancelled:
        $ref: '#/components/messages/LeagueCancelled'
      leagueUpdated:
        $ref: '#/components/messages/LeagueUpdated'

  friendlyLobbyStream:
    address: '/ws/friendlies/{friendly_id}/lobby'
    description: |
      Eventos de inscripción de un rival e inicio del partido, mientras un amistoso espera oponente.

      Lo escuchan los dos clubes: el creador apenas crea el amistoso, y el rival después de unirse (`POST /friendlies/{friendly_id}/join`). Si al conectarse el amistoso ya tiene rival, el servidor le envía `friendlyClubRegistered` a ese cliente, así el rival también recibe `starts_at` para la cuenta regresiva.

      Si el amistoso no existe, el servidor cierra la conexión con el código `4404`.
    parameters:
      friendly_id:
        description: ID único del amistoso.
    messages:
      friendlyClubRegistered:
        $ref: '#/components/messages/FriendlyClubRegistered'
      friendlyStart:
        $ref: '#/components/messages/FriendlyStart'

  matchStream:
    address: '/ws/matches/{match_id}'
    description: |
      Eventos en tiempo real de un partido puntual: un amistoso, un partido de liga o una prueba de comportamiento (`POST /club/behaviors/test`).

      Secuencia de mensajes
      1. Al conectarse: `matchStarted` (solo a ese cliente) y a continuación el último `matchState` disponible. Antes del primer tick puede haber unos segundos de espera hasta `match_start`; durante esa espera el último `matchState` es el del tick 0, con jugadores y pelota en sus posiciones iniciales.
      2. En cada tick: primero los `goal` de ese tick (si hubo) y después el `matchState`. Los dos llevan el mismo `tick`. Tras un gol, ese `matchState` ya muestra a los jugadores y la pelota en las posiciones iniciales.
      3. Pausas: después de los ticks `T/4`, `T/2` y `3T/4` (con `T` = `total_ticks`) llega `coolingBreakStart`, `halftimeStart` y `coolingBreakStart`. Durante la pausa no llegan `matchState`, y las sustituciones se ejecutan con `substitutionMade`. Al terminar llega `matchResumed`.
      4. Penales (solo en una liga sin empates, si el partido terminó igualado): `penaltyShootoutStart` abre una ventana para elegir los pateadores. Después, en cada penal llegan los `matchState` con los dos jugadores del penal y al final un `penaltyResult`.
      5. Al terminar: el último `matchState`, después `matchFinished`, y el servidor cierra la conexión con el código `1000`.

      Una prueba de comportamiento tiene un jugador por equipo, dura 600 ticks y no tiene pausas ni penales.

      **Cierre de la conexión.** Si el partido no existe o ya terminó, el servidor cierra la conexión con el código `4404`. Cuando el partido termina, la cierra con el código `1000`.
    parameters:
      match_id:
        description: ID único del partido en curso.
    messages:
      matchStarted:
        $ref: '#/components/messages/MatchStarted'
      matchState:
        $ref: '#/components/messages/MatchState'
      goal:
        $ref: '#/components/messages/Goal'
      coolingBreakStart:
        $ref: '#/components/messages/CoolingBreakStart'
      halftimeStart:
        $ref: '#/components/messages/HalftimeStart'
      matchResumed:
        $ref: '#/components/messages/MatchResumed'
      substitutionMade:
        $ref: '#/components/messages/SubstitutionMade'
      behaviorChanged:
        $ref: '#/components/messages/BehaviorChanged'
      penaltyShootoutStart:
        $ref: '#/components/messages/PenaltyShootoutStart'
      penaltyResult:
        $ref: '#/components/messages/PenaltyResult'
      matchFinished:
        $ref: '#/components/messages/MatchFinished'

  notificationStream:
    address: '/ws/notifications'
    description: |
      Notificaciones nuevas del club del usuario. Las anteriores se piden con `GET /notifications`.

      Si el usuario no tiene club, el servidor cierra la conexión con el código `4404`.
    messages:
      notification:
        $ref: '#/components/messages/Notification'

operations:
  receiveLeagueLobbyEvent:
    action: receive
    channel:
      $ref: '#/channels/leagueLobbyStream'
    summary: El usuario recibe los eventos de una liga, mientras espera que inicie y mientras se juega.

  receiveFriendlyLobbyEvent:
    action: receive
    channel:
      $ref: '#/channels/friendlyLobbyStream'
    summary: El usuario recibe notificaciones cuando un club se une al amistoso, y cuando el partido está por comenzar.

  receiveMatchEvent:
    action: receive
    channel:
      $ref: '#/channels/matchStream'
    summary: El usuario recibe todos los eventos que ocurren durante la simulación del partido.

  receiveNotification:
    action: receive
    channel:
      $ref: '#/channels/notificationStream'
    summary: El usuario recibe las notificaciones nuevas de su club.

components:
  messages:
    # --- leagueLobbyStream ---
    ClubRegistered:
      name: clubRegistered
      description: Notifica que un club se inscribió en la liga.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: clubRegistered
          data:
            $ref: '#/components/schemas/ClubRegisteredData'

    ClubLeft:
      name: clubLeft
      description: Notifica que un club abandonó la liga.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: clubLeft
          data:
            $ref: '#/components/schemas/ClubLeftData'

    LeagueStarted:
      name: leagueStarted
      description: Notifica que la liga arrancó.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: leagueStarted
          data:
            $ref: '#/components/schemas/LeagueStartedData'

    LeagueCancelled:
      name: leagueCancelled
      description: Notifica a los clubes inscriptos que el dueño canceló la liga antes de su inicio.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: leagueCancelled
          data:
            $ref: '#/components/schemas/LeagueCancelledData'

    LeagueUpdated:
      name: leagueUpdated
      description: Notifica que cambió algo de una liga en curso (arrancó o terminó un partido, o terminó la liga). El frontend vuelve a pedir el detalle, el fixture y la tabla.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: leagueUpdated
          data:
            $ref: '#/components/schemas/LeagueUpdatedData'

    # --- friendlyLobbyStream ---
    FriendlyClubRegistered:
      name: friendlyClubRegistered
      description: Notifica a los clubes del amistoso que un club rival se inscribió y cuándo arranca el partido.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: friendlyClubRegistered
          data:
            $ref: '#/components/schemas/FriendlyClubRegisteredData'
      examples:
        - name: rivalInscripto
          payload:
            type: friendlyClubRegistered
            data:
              friendly_id: 9b2f6c1e-4d3a-4f7b-8a21-5c0e9d7b3a10
              club_id: c2a7e5d4-8b1f-4c3e-9a6d-2f4b8e1c7a55
              club_name: Chaca
              starts_at: '2026-10-04T18:30:30Z'

    FriendlyStart:
      name: friendlyStart
      description: Notifica que el partido del amistoso está por comenzar, tras la ventana de espera de 30 segundos. El canal se cierra después de emitir este mensaje.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: friendlyStart
          data:
            $ref: '#/components/schemas/FriendlyStartData'
      examples:
        - name: inicioAmistoso
          payload:
            type: friendlyStart
            data:
              friendly_id: 9b2f6c1e-4d3a-4f7b-8a21-5c0e9d7b3a10
              match_id: 5e1d3c7a-2b9f-4a6e-8c4d-1f7a9b3e6d22

    # --- matchStream ---
    MatchStarted:
      name: matchStarted
      description: Datos iniciales del partido (clubes, alineaciones, duración y marcador). Se envía a cada cliente apenas se conecta, no es un broadcast, así quien entra a la vista tiene todo lo necesario para dibujarla.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: matchStarted
          data:
            $ref: '#/components/schemas/MatchStartedData'
      examples:
        - name: alConectarse
          summary: Alineaciones recortadas a dos jugadores por equipo para el ejemplo (en el partido vienen los 6 convocados de cada club).
          payload:
            type: matchStarted
            data:
              match_id: 5e1d3c7a-2b9f-4a6e-8c4d-1f7a9b3e6d22
              home_club:
                id: a1f4c8e2-6d3b-4e7a-9c5f-3b8d1e6a4f01
                name: River Plate
                avatar_url: https://example.com/avatars/lambda.png
              away_club:
                id: c2a7e5d4-8b1f-4c3e-9a6d-2f4b8e1c7a55
                name: Chacarita
                avatar_url: https://example.com/avatars/pythonistas.png
              home_lineup:
                - player_id: 0d9e8f7a-1b2c-4d3e-8f4a-5b6c7d8e9f01
                  number: 10
                  name: José
                  is_starter: true
                  power: 80
                  agility: 60
                  control: 60
                  speed: 60
                  strength: 40
                  behavior_id: 7c6b5a49-3e2d-4f1c-9b8a-6d5e4f3a2b10
                  behavior_name: Atacante
                - player_id: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a02
                  number: 12
                  name: Pistola
                  is_starter: false
                  power: 60
                  agility: 60
                  control: 60
                  speed: 60
                  strength: 60
              away_lineup:
                - player_id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b03
                  number: 9
                  name: Toro
                  is_starter: true
                  power: 70
                  agility: 50
                  control: 60
                  speed: 70
                  strength: 50
                - player_id: 3a4b5c6d-7e8f-4a9b-8c1d-2e3f4a5b6c04
                  number: 5
                  name: Discoteca
                  is_starter: false
                  power: 60
                  agility: 60
                  control: 60
                  speed: 60
                  strength: 60
              match_start: '2026-10-04T18:30:33Z'
              tick: 0
              total_ticks: 3000
              home_score: 0
              away_score: 0
              status: in_progress

    MatchState:
      name: matchState
      description: Notifica el estado del partido en el tick actual (posiciones de jugadores y pelota). Se emite en cada tick de la simulación, después de los `goal` de ese tick.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: matchState
          data:
            $ref: '#/components/schemas/MatchStateData'
      examples:
        - name: tickEnJuego
          payload:
            type: matchState
            data:
              match_id: 5e1d3c7a-2b9f-4a6e-8c4d-1f7a9b3e6d22
              tick: 1234
              players:
                - player_id: 0d9e8f7a-1b2c-4d3e-8f4a-5b6c7d8e9f01
                  position: {x: 6.42, 'y': -1.1}
                - player_id: 4b5c6d7e-8f9a-4b0c-9d1e-3f4a5b6c7d05
                  position: {x: -3.8, 'y': 4.25}
                - player_id: 5c6d7e8f-9a0b-4c1d-8e2f-4a5b6c7d8e06
                  position: {x: -10.0, 'y': -5.5}
                - player_id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b03
                  position: {x: 8.15, 'y': 0.3}
                - player_id: 6d7e8f9a-0b1c-4d2e-9f3a-5b6c7d8e9f07
                  position: {x: 12.0, 'y': 5.0}
                - player_id: 7e8f9a0b-1c2d-4e3f-8a4b-6c7d8e9f0a08
                  position: {x: 15.7, 'y': -3.2}
              ball_position: {x: 7.05, 'y': -0.9}

    Goal:
      name: goal
      description: Notifica al usuario que se ha marcado un gol en el partido. Se envía antes del `matchState` del mismo tick.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: goal
          data:
            $ref: '#/components/schemas/GoalData'
      examples:
        - name: golLocal
          payload:
            type: goal
            data:
              match_id: 5e1d3c7a-2b9f-4a6e-8c4d-1f7a9b3e6d22
              tick: 1834
              player_id: 0d9e8f7a-1b2c-4d3e-8f4a-5b6c7d8e9f01
              minute: 3
              team_id: a1f4c8e2-6d3b-4e7a-9c5f-3b8d1e6a4f01
              home_score: 1
              away_score: 0

    CoolingBreakStart:
      name: coolingBreakStart
      description: Notifica al usuario que comenzó una pausa de hidratación (cooling break) del partido.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: coolingBreakStart
          data:
            $ref: '#/components/schemas/CoolingBreakStartData'

    HalftimeStart:
      name: halftimeStart
      description: Notifica al usuario que ha iniciado el descanso (entretiempo) del partido.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: halftimeStart
          data:
            $ref: '#/components/schemas/HalftimeStartData'

    MatchResumed:
      name: matchResumed
      description: Notifica la reanudación del partido luego de una pausa.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: matchResumed
          data:
            $ref: '#/components/schemas/MatchResumedData'

    SubstitutionMade:
      name: substitutionMade
      description: Notifica que se ejecutó una sustitución.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: substitutionMade
          data:
            $ref: '#/components/schemas/SubstitutionMadeData'

    BehaviorChanged:
      name: behaviorChanged
      description: Notifica que se cambió el comportamiento de un jugador durante el partido. 
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: behaviorChanged
          data:
            $ref: '#/components/schemas/BehaviorChangedData'

    PenaltyShootoutStart:
      name: penaltyShootoutStart
      description: Notifica que el partido terminó igualado en una liga sin empates y se define por penales. Abre la ventana para elegir los pateadores con `PUT /matches/{match_id}/penalty-order`.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: penaltyShootoutStart
          data:
            $ref: '#/components/schemas/PenaltyShootoutStartData'

    PenaltyResult:
      name: penaltyResult
      description: Notifica el resultado de un penal de la tanda y el resultado acumulado.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: penaltyResult
          data:
            $ref: '#/components/schemas/PenaltyResultData'

    MatchFinished:
      name: matchFinished
      description: Notifica al usuario que el partido ha terminado. Es el último mensaje del canal, se envía después del último `matchState` y luego el servidor cierra la conexión con el código `1000`.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: matchFinished
          data:
            $ref: '#/components/schemas/MatchFinishedData'
      examples:
        - name: finDelPartido
          payload:
            type: matchFinished
            data:
              match_id: 5e1d3c7a-2b9f-4a6e-8c4d-1f7a9b3e6d22
              tick: 3000
              match_end: '2026-10-04T18:36:33Z'
              home_score: 2
              away_score: 1
              home_penalties: null
              away_penalties: null
              status: finished

    # --- notificationStream ---
    Notification:
      name: notification
      description: Notifica una notificación nueva del club. Trae los mismos campos que `Notification` de `GET /notifications`.
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            const: notification
          data:
            $ref: '#/components/schemas/NotificationData'

  schemas:
    # --- leagueLobbyStream ---
    ClubRegisteredData:
      type: object
      required: [league_id, club_id, club_name, registered_count]
      properties:
        league_id:
          type: string
          description: ID de la liga.
        club_id:
          type: string
          description: ID del club que se inscribió.
        club_name:
          type: string
          description: Nombre del club que se inscribió.
        registered_count:
          type: integer
          description: Cantidad total de clubes inscriptos en la liga tras esta inscripción.

    ClubLeftData:
      type: object
      required: [league_id, club_id, registered_count]
      properties:
        league_id:
          type: string
          description: ID de la liga.
        club_id:
          type: string
          description: ID del club que abandonó.
        registered_count:
          type: integer
          description: Cantidad total de clubes inscriptos en la liga tras este abandono.

    LeagueStartedData:
      type: object
      required: [league_id]
      properties:
        league_id:
          type: string
          description: ID de la liga.

    LeagueCancelledData:
      type: object
      required: [league_id]
      properties:
        league_id:
          type: string
          description: ID de la liga que fue cancelada.

    LeagueUpdatedData:
      type: object
      required: [league_id]
      properties:
        league_id:
          type: string
          description: ID de la liga.

    # --- friendlyLobbyStream ---
    FriendlyClubRegisteredData:
      type: object
      required: [friendly_id, club_id, club_name, starts_at]
      properties:
        friendly_id:
          type: string
          description: ID del amistoso.
        club_id:
          type: string
          description: ID del club que se inscribió.
        club_name:
          type: string
          description: Nombre del club que se inscribió.
        starts_at:
          type: string
          format: date-time
          description: Fecha y hora en que termina la ventana de espera de 30 segundos y se emite `friendlyStart`. Sirve para mostrar la cuenta regresiva.

    FriendlyStartData:
      type: object
      required: [friendly_id, match_id]
      properties:
        friendly_id:
          type: string
          description: ID del amistoso.
        match_id:
          type: string
          description: ID del partido creado, para que el frontend navegue a su vista y se suscriba a matchStream.

    # --- matchStream ---
    MatchStartedData:
      type: object
      required:
        - match_id
        - home_club
        - away_club
        - home_lineup
        - away_lineup
        - match_start
        - tick
        - total_ticks
        - home_score
        - away_score
        - status
      properties:
        match_id:
          type: string
          description: ID del partido.
        home_club:
          $ref: '#/components/schemas/ClubSummaryData'
        away_club:
          $ref: '#/components/schemas/ClubSummaryData'
        home_lineup:
          $ref: '#/components/schemas/Lineup'
        away_lineup:
          $ref: '#/components/schemas/Lineup'
        match_start:
          type: string
          format: date-time
          description: Fecha y hora en que arranca (o arrancó) el tick 0.
        tick:
          type: integer
          description: Tick actual del partido al momento de conectarse.
        total_ticks:
          type: integer
          description: Duración total del partido en ticks (10 ticks = 1 segundo).
        home_score:
          type: integer
          description: Marcador del equipo local.
        away_score:
          type: integer
          description: Marcador del equipo visitante.
        status:
          type: string
          enum:
            - in_progress
            - paused
            - finished
          description: Estado actual del partido.

    MatchStateData:
      type: object
      required: [match_id, tick, players, ball_position]
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Número de tick del partido al que corresponde este estado.
        players:
          type: array
          minItems: 2
          maxItems: 6
          description: Jugadores en cancha. Son 6 en un partido, y 2 en una prueba de comportamiento y en cada penal.
          items:
            type: object
            description: Posición actual de cada jugador en cancha.
            required: [player_id, position]
            properties:
              player_id:
                type: string
              position:
                type: object
                required: [x, 'y']
                properties:
                  x:
                    type: number
                    description: Coordenada x (horizontal) del jugador.
                  'y':
                    type: number
                    description: Coordenada y (vertical) del jugador.
        ball_position:
          type: object
          required: [x, 'y']
          properties:
            x:
              type: number
              description: Coordenada x (horizontal) de la pelota.
            'y':
              type: number
              description: Coordenada y (vertical) de la pelota.

    GoalData:
      type: object
      required:
        - match_id
        - tick
        - player_id
        - minute
        - team_id
        - home_score
        - away_score
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Tick del partido en el que se marcó el gol.
        player_id:
          type: string
          description: ID del último jugador que tocó la pelota antes del gol. En un gol en contra es un jugador del equipo rival al indicado en `team_id`.
        minute:
          type: integer
          description: Minuto simulado en el cual ocurrió el gol (derivado del tick).
        team_id:
          type: string
          description: ID del equipo al que se le suma el gol.
        home_score:
          type: integer
          description: Marcador del equipo local después de este gol.
        away_score:
          type: integer
          description: Marcador del equipo visitante después de este gol.

    CoolingBreakStartData:
      type: object
      required:
        - match_id
        - tick
        - cooling_break_number
        - cooling_break_start
        - ends_at
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Tick del partido en el que inició el cooling break.
        cooling_break_number:
          type: integer
          description: 'Numero del cooling break, primero o segundo.'
        cooling_break_start:
          type: string
          format: date-time
          description: Fecha y hora del inicio del cooling break.
        ends_at:
          type: string
          format: date-time
          description: Fecha y hora en que termina el cooling break.

    HalftimeStartData:
      type: object
      required:
        - match_id
        - tick
        - halftime_start
        - ends_at
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Tick del partido en el que inició el descanso.
        halftime_start:
          type: string
          format: date-time
          description: Fecha y hora del inicio del descanso.
        ends_at:
          type: string
          format: date-time
          description: Fecha y hora en que termina el descanso.

    MatchResumedData:
      type: object
      required:
        - match_id
        - tick
        - resume_type
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Tick del partido en el que se reanudó.
        resume_type:
          type: string
          enum:
            - after_cooling_break_1
            - after_cooling_break_2
            - after_halftime

    SubstitutionMadeData:
      type: object
      required:
        - match_id
        - tick
        - player_in_id
        - player_out_id
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Tick del partido en el que se ejecutó el cambio.
        player_in_id:
          type: string
          description: ID del jugador que entra.
        player_out_id:
          type: string
          description: ID del jugador que sale.
        behavior_id:
          type: string
          description: ID del comportamiento del jugador ingresante.
        behavior_name:
          type: string
          description: Nombre del comportamiento del jugador ingresante.

    BehaviorChangedData:
      type: object
      required:
        - match_id
        - tick
        - player_id
        - behavior_id
        - behavior_name
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Tick del partido en el que se hizo el cambio. El nuevo comportamiento rige desde el tick siguiente.
        player_id:
          type: string
          description: ID del jugador cuyo comportamiento cambió.
        behavior_id:
          type: string
          description: ID del nuevo comportamiento.
        behavior_name:
          type: string
          description: Nombre del nuevo comportamiento.

    PenaltyShootoutStartData:
      type: object
      required: [match_id, ends_at]
      properties:
        match_id:
          type: string
          description: ID del partido.
        ends_at:
          type: string
          format: date-time
          description: Fecha y hora en que se cierra la ventana para elegir los pateadores.

    PenaltyResultData:
      type: object
      required: [match_id, team_id, scored, home_penalties, away_penalties]
      properties:
        match_id:
          type: string
          description: ID del partido.
        team_id:
          type: string
          description: ID del club que pateó.
        scored:
          type: boolean
          description: true si el penal fue gol.
        home_penalties:
          type: integer
          description: Penales convertidos por el local hasta este penal.
        away_penalties:
          type: integer
          description: Penales convertidos por el visitante hasta este penal.

    MatchFinishedData:
      type: object
      required:
        - match_id
        - tick
        - match_end
        - home_score
        - away_score
        - home_penalties
        - away_penalties
        - status
      properties:
        match_id:
          type: string
          description: ID del partido.
        tick:
          type: integer
          description: Último tick simulado del partido.
        match_end:
          type: string
          format: date-time
          description: Fecha y hora del final del partido.
        home_score:
          type: integer
          description: Marcador final del equipo local.
        away_score:
          type: integer
          description: Marcador final del equipo visitante.
        home_penalties:
          type: [integer, 'null']
          description: Penales convertidos por el local. null si el partido no se definió por penales.
        away_penalties:
          type: [integer, 'null']
          description: Penales convertidos por el visitante. null si el partido no se definió por penales.
        status:
          type: string
          enum:
            - finished
          description: Estado final del partido.

    ClubSummaryData:
      type: object
      description: Datos de un club para mostrar en el marcador.
      required: [id, name, avatar_url]
      properties:
        id:
          type: string
          description: ID del club (el mismo que `team_id` en `goal`).
        name:
          type: string
          description: Nombre del club.
        avatar_url:
          type: string
          description: URL del avatar del club.

    Lineup:
      type: array
      description: Lista de los convocados del equipo (titulares y suplentes) con sus atributos PACSS. En una prueba de comportamiento hay un solo jugador.
      items:
        type: object
        required:
          - player_id
          - number
          - name
          - is_starter
        properties:
          player_id:
            type: string
            description: ID del jugador.
          number:
            type: integer
            description: Número de camiseta del jugador
            minimum: 1
            maximum: 99
          name:
            type: string
            description: Nombre del jugador.
          is_starter:
            type: boolean
            description: true si está en cancha, false si está en el banco.
          power:
            type: integer
            description: Atributo Power.
            minimum: 20
            maximum: 100
          agility:
            type: integer
            description: Atributo Agility.
            minimum: 20
            maximum: 100
          control:
            type: integer
            description: Atributo Control.
            minimum: 20
            maximum: 100
          speed:
            type: integer
            description: Atributo Speed.
            minimum: 20
            maximum: 100
          strength:
            type: integer
            description: Atributo Strength
            minimum: 20
            maximum: 100
          behavior_id:
            type: string
            description: ID del comportamiento.
          behavior_name:
            type: string
            description: Nombre visible del comportamiento.

    # --- notificationStream ---
    NotificationData:
      type: object
      required: [id, message, league_id, read, created_at]
      properties:
        id:
          type: string
          description: ID de la notificación.
        message:
          type: string
          description: Texto de la notificación.
        league_id:
          type: [string, 'null']
          description: Liga a la que se refiere la notificación.
        read:
          type: boolean
          description: Siempre false en una notificación nueva.
        created_at:
          type: string
          format: date-time
          description: Fecha y hora en que se generó la notificación.

  securitySchemes:
    queryToken:
      type: httpApiKey
      name: token
      in: query
      description: JWT de sesión (el que devuelve `POST /auth/login`) en el parámetro `token` de la URL. Si falta o es inválido, el servidor cierra la conexión con el código `4401`.
