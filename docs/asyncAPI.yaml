asyncapi: 3.1.0

info:
  title: FutBot - Especificación de los canales WebSocket de la API de FutBot
  version: 1.0.0
  description: Se definen los eventos que el servidor empuja al cliente en tiempo real durante un partido (estado de jugadores y la pelota, goles, pausas, sustituciones, fin de partido) y durante la espera de inicio de ligas y amistosos (inscripciones, abandonos, inicio).

servers:
  desarrollo:
    host: 'localhost:8080'
    protocol: ws

channels:
  ligaLobbyStream:
    address: '/ws/ligas/{liga_id}/lobby'
    description: Eventos de inscripción/abandono de clubes e inicio, mientras una liga espera para arrancar.
    parameters:
      liga_id:
        description: ID único de la liga.
    messages:
      clubInscripto:
        $ref: '#/components/messages/ClubInscripto'
      clubAbandono:
        $ref: '#/components/messages/ClubAbandono'
      ligaIniciada:
        $ref: '#/components/messages/LigaIniciada'
      ligaCancelada:
        $ref: '#/components/messages/LigaCancelada'

  amistosoLobbyStream:
    address: '/ws/amistosos/{amistoso_id}/lobby'
    description: Eventos de inscripción de un rival e inicio del partido, mientras un amistoso espera oponente.
    parameters:
      amistoso_id:
        description: ID único del amistoso.
    messages:
      clubInscripto:
        $ref: '#/components/messages/ClubInscriptoAmistoso'
      inicioAmistoso:
        $ref: '#/components/messages/InicioAmistoso'

  partidoStream:
    address: '/ws/partidos/{partido_id}'
    description: Eventos en tiempo real de un partido puntual.
    parameters:
      partido_id:
        description: ID único del partido en curso.
    messages:
      partidoIniciado:
        $ref: '#/components/messages/PartidoIniciado'
      estadoPartido:
        $ref: '#/components/messages/EstadoPartido'
      gol:
        $ref: '#/components/messages/Gol'
      coolingBreakInit:
        $ref: '#/components/messages/CoolingBreakInit'
      descansoInit:
        $ref: '#/components/messages/DescansoInit'
      reanudacionPartido:
        $ref: '#/components/messages/ReanudacionPartido'
      cambioRealizado:
        $ref: '#/components/messages/CambioRealizado'
      partidoFinalizado:
        $ref: '#/components/messages/PartidoFinalizado'

operations:
  recibirEventoDeLobbyLiga:
    action: receive
    channel:
      $ref: '#/channels/ligaLobbyStream'
    summary: El usuario recibe notificaciones cuando un club se une o abandona la liga mientras espera que inicie, y cuando la liga arranca.

  recibirEventoDeLobbyAmistoso:
    action: receive
    channel:
      $ref: '#/channels/amistosoLobbyStream'
    summary: El usuario recibe notificaciones cuando un club se une al amistoso, y cuando el partido está por comenzar.

  recibirEventoDePartido:
    action: receive
    channel:
      $ref: '#/channels/partidoStream'
    summary: El usuario recibe todos los eventos que ocurren durante la simulación del partido.

components:
  messages:
    # --- ligaLobbyStream ---
    ClubInscripto:
      description: Notifica que un club se inscribió en la liga.
      payload:
        type: object
        required: [liga_id, club_id, nombre_club, cantidad_inscriptos]
        properties:
          liga_id:
            type: string
            description: ID de la liga.
          club_id:
            type: string
            description: ID del club que se inscribió.
          nombre_club:
            type: string
            description: Nombre del club que se inscribió.
          cantidad_inscriptos:
            type: integer
            description: Cantidad total de clubes inscriptos en la liga tras esta inscripción.

    ClubAbandono:
      description: Notifica que un club abandonó la liga.
      payload:
        type: object
        required: [liga_id, club_id, cantidad_inscriptos]
        properties:
          liga_id:
            type: string
            description: ID de la liga.
          club_id:
            type: string
            description: ID del club que abandonó.
          cantidad_inscriptos:
            type: integer
            description: Cantidad total de clubes inscriptos en la liga tras este abandono.

    LigaIniciada:
      description: Notifica que la liga arrancó.
      payload:
        type: object
        required: [liga_id]
        properties:
          liga_id:
            type: string
            description: ID de la liga.
    
    LigaCancelada:
      description: Notifica a los clubes inscriptos que el dueño canceló la liga antes de su inicio.
      payload:
        type: object
        required: [liga_id]
        properties:
          liga_id:
            type: string
            description: ID de la liga que fue cancelada.

    # --- amistosoLobbyStream ---
    ClubInscriptoAmistoso:
      description: Notifica al creador del amistoso que un club rival se inscribió.
      payload:
        type: object
        required: [amistoso_id, club_id, nombre_club]
        properties:
          amistoso_id:
            type: string
            description: ID del amistoso.
          club_id:
            type: string
            description: ID del club que se inscribió.
          nombre_club:
            type: string
            description: Nombre del club que se inscribió.

    InicioAmistoso:
      description: Notifica que el partido del amistoso está por comenzar, tras la ventana de espera de 30 segundos. El canal se cierra después de emitir este mensaje.
      payload:
        type: object
        required: [amistoso_id, partido_id]
        properties:
          amistoso_id:
            type: string
            description: ID del amistoso.
          partido_id:
            type: string
            description: ID del partido creado, para que el frontend navegue a su vista y se suscriba a partidoStream.

    # --- partidoStream ---
    PartidoIniciado:
      description: Notifica al usuario que el partido ha comenzado.
      payload:
        type: object
        required:
          - partido_id
          - inicio_partido
          - marcador_local
          - marcador_visitante
          - estado
        properties:
          partido_id:
            type: string
            description: ID del partido.
          alineacion_local:
            $ref: '#/components/schemas/Alineacion'
          alineacion_visitante:
            $ref: '#/components/schemas/Alineacion'
          inicio_partido:
            type: string
            format: date-time
            description: Fecha y hora de incio del partido.
          marcador_local:
            type: integer
            description: Marcador del equipo local.
          marcador_visitante:
            type: integer
            description: Marcador del equipo visitante.
          estado:
            type: string
            enum:
              - en_curso
              - pausado
              - finalizado
            description: Estado actual del partido.

    EstadoPartido:
      description: Notifica el estado del partido en el tick actual (posiciones de jugadores y pelota). Se emite en cada tick de la simulación.
      payload:
        type: object
        required: [partido_id, tick, jugadores, posicion_pelota]
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Número de tick del partido al que corresponde este estado.
          jugadores:
            type: array
            minItems: 6
            maxItems: 6
            items:
              type: object
              description: Posición actual de cada jugador en cancha.
              required: [jugador_id, posicion]
              properties:
                jugador_id:
                  type: string
                posicion:
                  type: object
                  properties:
                    x:
                      type: number
                      description: Coordenada x (horizontal) del jugador.
                    'y':
                      type: number
                      description: Coordenada y (vertical) del jugador.
          posicion_pelota:
            type: object
            properties:
              x:
                type: number
                description: Cordenada x (horizontal) de la pelota.
              'y':
                type: number
                description: Coordenada y (vertical) de la pelota.

    Gol:
      description: Notifica al usuario que se ha marcado un gol en el partido.
      payload:
        type: object
        required:
          - partido_id
          - tick
          - jugador_id
          - minuto
          - equipo_id
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Tick del partido en el que se marcó el gol.
          jugador_id:
            type: string
            description: ID del jugador que marcó.
          minuto:
            type: integer
            description: Minuto simulado en el cual ocurrió el gol (derivado del tick).
          equipo_id:
            type: string
            description: ID del equipo que marcó.

    CoolingBreakInit:
      description: Notifica al usuario que ha iniciado un partido.
      payload:
        type: object
        required:
          - partido_id
          - tick
          - coolingbreak_numero
          - inicio_cooling
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Tick del partido en el que inició el cooling break.
          coolingbreak_numero:
            type: integer
            description: 'Numero del cooling break, primero o segundo.'
          inicio_cooling:
            type: string
            format: date-time
            description: Fecha y hora del inicio del cooling break.

    DescansoInit:
      description: Notifica al usuario que ha iniciado el descanso (entretiempo) del partido.
      payload:
        type: object
        required:
          - partido_id
          - tick
          - inicio_descanso
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Tick del partido en el que inició el descanso.
          inicio_descanso:
            type: string
            format: date-time
            description: Fecha y hora del inicio del descanso.

    ReanudacionPartido:
      description: Notifica la reanudación del partido luego de una pausa.
      payload:
        type: object
        required:
          - partido_id
          - tick
          - tipo_reanudacion
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Tick del partido en el que se reanudó.
          tipo_reanudacion:
            type: string
            enum:
              - postCooling_1
              - postCooling_2
              - postDescanso

    CambioRealizado:
      description: Notifica que se ejecutó una sustitución programada.
      payload:
        type: object
        required:
          - partido_id
          - tick
          - jugador_entra_id
          - jugador_sale_id
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Tick del partido en el que se ejecutó el cambio.
          jugador_entra_id:
            type: string
            description: ID del jugador que entra.
          jugador_sale_id:
            type: string
            description: ID del jugador que sale.

    PartidoFinalizado:
      description: Notifica al usuario que el partido ha terminado.
      payload:
        type: object
        required:
          - partido_id
          - tick
          - fin_partido
          - marcador_local
          - marcador_visitante
          - estado
        properties:
          partido_id:
            type: string
            description: ID del partido.
          tick:
            type: integer
            description: Último tick simulado del partido.
          fin_partido:
            type: string
            format: date-time
            description: Fecha y hora del final del partido.
          marcador_local:
            type: integer
            description: Marcador final del equipo local.
          marcador_visitante:
            type: integer
            description: Marcador final del equipo visitante.
          estado:
            type: string
            enum:
              - finalizado
            description: Estado final del partido.

  schemas:
    Alineacion:
      type: array
      description: Lista de jugadores del equipo con sus atributos PACSS.
      items:
        type: object
        required:
          - jugador_id
          - numero
          - nombre
          - es_titular
        properties:
          jugador_id:
            type: string
            description: ID del jugador.
          numero:
            type: integer
            description: Número de camiseta del jugador
            minimum: 1
            maximum: 99
          es_titular:
            type: boolean
            description: 'true si es Titular, false si no.'
          power:
            type: integer
            description: Atributo Power.
            minimum: 20
            maximum: 100
          agility:
            type: integer
            description: Atributo Agility.
            minimum: 20
            maximum: 100
          control:
            type: integer
            description: Atributo Control.
            minimum: 20
            maximum: 100
          speed:
            type: integer
            description: Atributo Speed.
            minimum: 20
            maximum: 100
          strength:
            type: integer
            description: Atributo Strength
            minimum: 20
            maximum: 100
          comportamiento_id:
            type: string
            description: ID del comportamiento.
          comportamientoNombre:
            type: string
            description: Nombre visible del comportamiento.
