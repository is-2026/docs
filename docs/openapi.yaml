openapi: 3.1.0
info:
  title: FutBot API
  version: 2.0.0
  description: API REST para la plataforma FutBot:\ Gestion de usuarios, jugadores, partidos, ligas, comportamientos en Python y datos del ranking
servers:
  - url: https://localhost:8000
    description: Entorno de desarrollo local

tags:
  - name: Authentication
  - name: User
  - name: Club
  - name: Players
  - name: Behaviors
  - name: Leagues
  - name: Friendlies
  - name: Match
  - name: Ranking
  - name: Notifications

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Autenticación y Usuario
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentication]
      summary: Registrar Usuario
      description: Crea la cuenta sin validar y le manda al email un código de 6 dígitos para validarla (POST /auth/verify-email). No inicia sesión. El club se crea en un paso separado (POST /club) después del primer login.
      operationId: register_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: Usuario registrado, con la cuenta sin validar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Validar cuenta con el código enviado por mail
      operationId: verify_email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
      responses:
        '200':
          description: Cuenta validada
        '400':
          description: Código inválido o vencido. Incluye un código incorrecto, vencido, ya usado o invalidado por intentos, y un email que no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La cuenta ya estaba validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email/resend:
    post:
      tags: [Authentication]
      summary: Reenviar el código de validación de cuenta
      description: Manda un código nuevo y el anterior deja de servir. Para un email que no existe o una cuenta ya validada responde 200 sin mandar nada.
      operationId: resend_verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Código reenviado
        '429':
          description: El código anterior se pidió hace menos de 60 s. El mensaje indica cuántos segundos faltan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesion
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La cuenta no está validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Pedir un código para recuperar la contraseña
      description: Responde siempre 200. Si el email existe, le manda un código de 6 dígitos, salvo que el anterior se haya pedido hace menos de 60 s.
      operationId: request_password_reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Pedido recibido

  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Definir una contraseña nueva con el código
      description: Guarda la contraseña nueva e invalida el código.
      operationId: confirm_password_reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmInput'
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: Código inválido o vencido (incorrecto, vencido, ya usado o invalidado por intentos), o la contraseña nueva no cumple las reglas del registro. En este último caso el código no se consume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar sesión
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user:
    get:
      tags: [User]
      summary: Obtener mi usuario
      description: Identifica al usuario mediante el token de sesión.
      operationId: get_my_user
      responses:
        '200':
          description: Datos de la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/password:
    patch:
      tags: [User]
      summary: Modificar contraseña
      operationId: change_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: La contraseña actual es incorrecta, o la nueva coincide con la actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ---------------------------------------------------------------------------
  # Club
  # ---------------------------------------------------------------------------
  /club:
    post:
      tags: [Club]
      summary: Crear club (segundo paso del registro)
      operationId: create_club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClubInput'
      responses:
        '201':
          description: Club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          description: Falta alguno de los dos campos o las entradas son inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':  
          description: El usuario ya tiene un club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Club]
      summary: Obtener mi club
      operationId: get_my_club 
      description: Identifica al club mediante el token de sesión.
      responses:
        '200':
          description: Datos del club propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El usuario todavía no tiene club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /club/avatar:
    patch:
      tags: [Club]
      summary: Cambiar avatar del club
      operationId: change_avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAvatarInput'
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          description: La URL no es válida o tiene más de 512 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
           $ref: '#/components/responses/Unauthorized'
        '404':
          description: El usuario todavía no tiene club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /club/coach:
    patch:
      tags: [Club]
      summary: Elegir o quitar el DT del club
      description: Con behavior_id null el club queda sin DT. El cambio rige desde el próximo partido; no cambia un partido en juego.
      operationId: change_coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCoachInput'
      responses:
        '200':
          description: DT actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          description: El comportamiento no existe, es de otro club o es de tipo jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El usuario todavía no tiene club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /club/history:
    get:
      tags: [Club]
      summary: Ver historial de partidos de mi club
      operationId: get_my_history
      responses:
        '200':
          description: Historial de partidos jugados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /clubs/{club_id}/history:
    parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Club]
      summary: Ver historial compartido con otro club
      description: Historial de partidos jugados entre el club del usuario autenticado y el club indicado.
      operationId: get_shared_history
      responses:
        '200':
          description: Historial de partidos entre ambos clubes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
        '400':
          description: No se puede consultar el historial compartido con el propio club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{club_id}:
    get:
      tags: [Club]
      summary: Ver perfil de otro club
      description: Datos públicos del club, su posición en el ranking y sus estadísticas en ligas públicas (las mismas que su fila en GET /ranking).
      operationId: get_club
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Perfil público del club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' 


  # ---------------------------------------------------------------------------
  # Jugadores
  # ---------------------------------------------------------------------------
  /club/players:
    post:
      tags: [Players]
      summary: Crear jugador
      description: Crea un nuevo jugador en el club del usuario. Notar que la suma de sus PACSS debe ser exactamente 300.
      operationId: create_player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerInput'
      responses:
        '201':
          description: Jugador creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          description: El número de camiseta de jugdor está fuera de rango (1-99), la suma de los PACSS no es 300, o alguno está fuera de rango (20-100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El número de camiseta de jugdor está en uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        
    get:
      tags: [Players]
      summary: Listar jugadores del club
      operationId: list_my_players
      responses:
        '200':
          description: Plantilla completa del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
        '401':
           $ref: '#/components/responses/Unauthorized'

  /club/players/{player_id}:
    parameters:
      - name: player_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Players]
      summary: Obtener jugador
      operationId: get_my_player
      responses:
        '200':
          description: Datos del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Players]
      summary: Eliminar jugador
      operationId: delete_player
      responses:
        '200':
          description: Jugador eliminado
        '401':
           $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El jugador está participando en una liga activa o un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  


# ----------------------------------------------------------------------------- 
# Comportamiento
# -----------------------------------------------------------------------------
  /club/behaviors:
    post:
      tags: [Behaviors]
      summary: Crear nuevo Comportamiento
      operationId: create_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBehaviorInput'
      responses:
        '201':
          description: Comportamiento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '400':
          description: El código no es válido (errores de sintaxis, instrucciones prohibidas o le falta decide_action o decide_coach según el tipo), o el nombre está vacío o tiene más de 30 caracteres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Nombre de comportamiento duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Behaviors]
      summary: Listar comportamientos guardados
      operationId: list_behaviors
      responses:
        '200':
          description: Comportamientos disponibles (OK)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Behavior'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /club/behaviors/{behavior_id}:
    parameters:
      - name: behavior_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Behaviors]
      summary: Obtener comportamiento por id
      operationId: get_behavior
      responses:
        '200':
          description: Detalle del comportamiento (OK)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Behaviors]
      summary: Editar comportamiento
      description: Cambia el nombre y el código. El tipo (kind) no se cambia, y la validación usa el que ya tiene guardado. También se pueden editar los comportamientos default del club.
      operationId: update_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBehaviorInput'
      responses:
        '200':
          description: Comportamiento editado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '400':
          description: El código o el nombre no son válidos, igual que al crear. No se cambia nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El comportamiento no existe o es de otro club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El comportamiento está en uso por un jugador en un partido en curso, o el nuevo nombre ya está en uso por otro comportamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Behaviors]
      summary: Eliminar comportamiento
      description: No se pueden eliminar comportamientos asignados
      operationId: delete_behavior
      responses:
        '200':
          description: Comportamiento eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El comportamiento está asignado en una alineación activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /club/behaviors/test:
    post:
      tags: [Behaviors]
      summary: Probar un comportamiento en una cancha 1 vs 1
      description: Valida el código y arranca un partido de prueba de 600 ticks, sin pausas, entre un jugador genérico con ese código y otro con el default Marcador. Se mira por /ws/matches/{match_id}. No se guarda ningún partido, amistoso ni comportamiento. Una segunda prueba del mismo club corta la primera.
      operationId: test_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviorTestInput'
      responses:
        '201':
          description: Prueba iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorTestResponse'
        '400':
          description: El código no es válido. El mensaje es el mismo que al guardar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'


# -----------------------------------------------------------------------------
# Ligas
# -----------------------------------------------------------------------------
  /leagues:
    post:
      tags: [Leagues]
      summary: Crear liga
      description: Notar que la cantidad de clubes tiene un mínimo duro de 3. Si se envía password, la liga se considera privada.
      operationId: create_league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeagueInput'
      responses:
        '201':
          description: Liga creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
        '400':
          description: max_clubs excede el límite del sistema, no se enviaron exactamente 3 titulares (con sus comportamientos) y 3 suplentes en players, o la formación no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Leagues]
      summary: Listar ligas
      description: Devuelve tanto ligas públicas como privadas. Solo no iniciadas
      operationId: list_leagues
      parameters:
        - name: name
          in: query
          required: false
          description: Devuelve solo las ligas cuyo nombre contiene este texto, sin distinguir mayúsculas.
          schema:
            type: string
      responses:
        '200':
          description: Ligas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /club/leagues:
    get:
      tags: [Leagues]
      summary: Listar ligas de mi club
      description: Identifica al club mediante el token de sesión. Devuelve las ligas en las que el club está inscripto, en cualquier estado salvo cancelled.
      operationId: list_my_leagues
      responses:
        '200':
          description: Ligas en las que participa mi club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leagues/{league_id}:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Obtener detalle de una liga
      operationId: get_league
      responses:
        '200':
          description: Datos de la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Leagues]
      summary: Cancelar liga
      description: Solo el creador puede cancelarla, y solo si no está iniciada.
      operationId: cancel_league
      responses:
        '200':
          description: Liga cancelada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga ya está iniciada, terminada o cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /leagues/{league_id}/join:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Leagues]
      summary: Unirse a una liga
      description: Reserva un cupo para la liga. Se definen 6 jugadores convocados para la liga (3 marcados como titulares por defecto, 3 como suplentes) y la formación. Luego se puede cambiar con PUT /leagues/{league_id}/lineup
      operationId: join_league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinLeagueInput'
      responses:
        '200':
          description: Inscripción registrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: La contraseña de la liga privada es incorrecta, no hay cupo, no se enviaron exactamente 3 titulares y 3 suplentes, o la formación no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El club ya está inscripto en esta liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Leagues]
      summary: Abandonar liga
      operationId: leave_league
      responses:
        '200':
          description: Inscripción eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La liga indicada no existe, o el club no está inscripto en ella
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La liga ya se encuentra iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /leagues/{league_id}/start:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Leagues]
      summary: Iniciar liga
      description: Solo el creador puede iniciarla, con al menos 3 clubes inscriptos. Sortea el fixture todos contra todos (cada par de clubes juega una vez; con una cantidad impar de clubes, uno queda libre en cada fecha), crea los partidos y la tabla de posiciones en cero, cambia el estado a "started" y lo avisa por el lobby. Desde ahí las fechas se juegan solas.
      operationId: start_league
      responses:
        '200':
          description: Liga iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
        '400':
          description: No hay suficientes clubes inscriptos para iniciar la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga ya está iniciada, terminada o cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /leagues/{league_id}/matches:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Listar partidos de una liga
      description: Devuelve el fixture ordenado por fecha.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, finished]
      operationId: list_league_matches
      responses:
        '200':
          description: Partidos de la liga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga aún no fue iniciada (not_started o cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /leagues/{league_id}/standings:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Tabla de posiciones
      operationId: get_standings
      responses:
        '200':
          description: Tabla de posiciones de la liga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingsItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga aún no fue iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /leagues/{league_id}/lineup:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Ver mi alineación en la liga
      description: Devuelve la alineación vigente del club en la liga, con la formación, los 3 titulares con su comportamiento y los 3 suplentes.
      operationId: get_league_lineup
      responses:
        '200':
          description: Alineación vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLineupInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El club no está inscripto en la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Leagues]
      summary: Cambiar mi alineación en la liga
      description: Guarda la alineación entre los 6 convocados del club en la liga. Rige desde el próximo partido del club; un cambio durante un partido no afecta ese partido. Los suplentes quedan sin comportamiento.
      operationId: update_league_lineup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLineupInput'
      responses:
        '200':
          description: Alineación guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLineupInput'
        '400':
          description: Los jugadores no son exactamente los 6 convocados del club en la liga, no son 3 titulares y 3 suplentes, hay repetidos, un titular no tiene comportamiento, un comportamiento es de otro club o de tipo DT, o la formación no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El club no está inscripto en la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga está terminada o cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# -----------------------------------------------------------------------------
# Amistosos
# -----------------------------------------------------------------------------
  /friendlies:
    get:
      tags: [Friendlies]
      summary: Listar amistosos
      description: Devuelve una lista de amistosos que están esperando rival, incluyendo públicos y privados.
      operationId: list_friendlies
      parameters:
        - name: club_name
          in: query
          required: false
          description: Devuelve solo los amistosos de clubes creadores cuyo nombre contiene este texto, sin distinguir mayúsculas.
          schema:
            type: string
      responses:
        '200':
          description: Lista de amistosos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friendly'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags: [Friendlies]
      summary: Crear amistoso
      description: Crea un amistoso esperando por un rival. Si se envía password, el amistoso se marca como privado.
      operationId: create_friendly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendlyInput'
      responses:
        '201':
          description: Amistoso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friendly'
        '400':
          description: No se enviaron exactamente 3 titulares y 3 suplentes, o la formación no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friendlies/{friendly_id}/join:
    parameters:
      - name: friendly_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Friendlies]
      summary: Unirse a un amistoso
      description: Se une a un amistoso creado por otro club. Si es privado, requiere la contraseña. Al unirse exitosamente, se genera el partido.
      operationId: join_friendly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinFriendlyInput'
      responses:
        '200':
          description: Unido al amistoso exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friendly'
        '400':
          description: Contraseña incorrecta, no se enviaron exactamente 3 titulares y 3 suplentes, o la formación no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El amistoso ya no está disponible (ya tiene rival o fue cancelado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /friendlies/{friendly_id}:
    parameters:
      - name: friendly_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Friendlies]
      summary: Cancelar amistoso
      description: Solo el club creador puede cancelarlo, y solo si aún no se ha unido ningún rival.
      operationId: cancel_friendly
      responses:
        '200':
          description: Amistoso cancelado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El amistoso ya tiene un rival y no puede ser cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


# -----------------------------------------------------------------------------
# Partidos
# -----------------------------------------------------------------------------
  /matches/{match_id}:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Match]
      summary: Obtener detalle de un partido
      description: Devuelve la información actualizada de un partido específico, incluyendo su estado y resultado actual.
      operationId: get_match
      responses:
        '200':
          description: Detalle del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /matches/{match_id}/players/{player_id}:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: player_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Match]
      summary: Cambiar comportamiento en vivo
      description: Se aplica desde el siguiente tick del simulador.
      operationId: change_live_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [behavior_id]
              properties:
                behavior_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Comportamiento actualizado
        '400':
          description: El comportamiento no existe, es de otro club o es de tipo DT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El club del usuario no juega ese partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El partido no está en juego, o el jugador no está en cancha en el club del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Se está jugando la tanda de penales, o el club tiene un DT a cargo del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /matches/{match_id}/substitutions:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Match]
      summary: Programar sustitución
      description: Cambia un titular por un suplente que entra en la posición del que sale con el comportamiento elegido. Se ejecuta al empezar la próxima pausa (hidratación o entretiempo). Si no agendo ninguna y se elige hacerla en la pausa, se ejecuta en el momento . Solo puede haber una sustitución pendiente por club a la vez. Un jugador que salió puede volver a entrar en otra pausa.
      operationId: schedule_substitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSubstitutionInput'
      responses:
        '201':
          description: Sustitución programada o ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Substitution'
        '400':
          description: El jugador que sale no está en la cancha, el que entra no está en el banco o el comportamiento no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El club del usuario no juega ese partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El partido no está en juego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya hay una sustitución pendiente, el club ya cambió en la pausa en curso, no quedan ventanas o el club tiene un DT a cargo del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Match]
      summary: Desprogramar sustitución
      description: Cancela la sustitución pendiente del club antes de que se alcance la ventana de cambio.
      operationId: unschedule_substitution
      responses:
        '200':
          description: Sustitución cancelada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No hay ninguna sustitución pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El club tiene un DT a cargo del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /matches/{match_id}/penalty-order:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Match]
      summary: Elegir los pateadores de la tanda de penales
      description: Solo durante la ventana de 30 s que se abre cuando un partido de una liga sin empates termina igualado. Se eligen 5 pateadores, en orden, entre los 6 convocados, cada uno con su comportamiento. Si al cerrar la ventana el club no eligió, patean los 3 que están en cancha por número de camiseta repetidos con el comportamiento que tenían.
      operationId: set_penalty_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenaltyOrderInput'
      responses:
        '200':
          description: Orden de pateadores registrado
        '400':
          description: No son 5 pateadores, hay repetidos, algún jugador no es de los 6 convocados del club, o un comportamiento no es propio o es de tipo DT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El club del usuario no juega ese partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El partido no está en juego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No hay una ventana de penales abierta, o el club tiene un DT a cargo del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# -----------------------------------------------------------------------------
# Ranking
# -----------------------------------------------------------------------------
  /ranking:
    get:
      tags: [Ranking]
      summary: Ver ranking global
      description: Suma las filas de la tabla de posiciones de cada club en todas las ligas públicas en curso o terminadas. No cuentan las ligas privadas. Solo aparecen los clubes con al menos un partido jugado en una liga pública. Con puntos iguales ordena por diferencia de gol, después por goles a favor y después por nombre.
      operationId: get_ranking
      responses:
        '200':
          description: Ranking mundial
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

# -----------------------------------------------------------------------------
# Notificaciones
# -----------------------------------------------------------------------------
  /notifications:
    get:
      tags: [Notifications]
      summary: Listar mis notificaciones
      description: Devuelve las últimas 50 notificaciones del club, de la más nueva a la más vieja. Se generan cuando termina un partido de liga, termina una liga o se cancela una liga. Las nuevas también llegan en tiempo real por /ws/notifications.
      operationId: list_notifications
      responses:
        '200':
          description: Notificaciones del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marcar todas mis notificaciones como leídas
      operationId: read_all_notifications
      responses:
        '200':
          description: Notificaciones marcadas como leídas
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No se proporcionó un token, o el token es inválido o expiró
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El usuario no tiene permisos para realizar esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # -- Autenticación / Usuario ---
    UserRegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    
    AuthResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
        
  
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyEmailInput:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código de 6 dígitos enviado por mail.

    PasswordResetConfirmInput:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código de 6 dígitos enviado por mail.
        new_password:
          type: string
          format: password
    
    # --- Club ---
    CreateClubInput:
      type: object
      required: [club_name, avatar_url]
      properties:
        club_name:
          type: string
        avatar_url:
          type: string
          format: uri
          description: URL pública de la imagen/avatar del club.

    ChangeAvatarInput:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          format: uri

    FormationPreset:
      type: string
      enum: [TRIANGLE, OFFENSIVE_LINE, DEFENSIVE_LINE]
      description: Formaciones predefinidas por el sistema. El usuario no elige en qué posición va cada uno, el sistmea va a ver donde los pone

    HistoryItem:
      type: object
      properties:
        match_id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        rival_club_id:
          type: string
          format: uuid
        rival_club_name:
          type: string
        own_score:
          type: integer
        rival_score:
          type: integer
        result:
          type: string
          enum: [won, lost, drawn]
    
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
        club_name:
          type: string
        avatar_url:
          type: string
          format: uri
        default_formation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        coach_behavior_id:
          type: [string, "null"]
          format: uuid
          description: Comportamiento de tipo DT activo del club, o null si no tiene DT.

    ClubProfile:
      type: object
      description: Perfil público de un club. Las estadísticas son las de su fila en GET /ranking (solo ligas públicas).
      properties:
        id:
          type: string
          format: uuid
        club_name:
          type: string
        avatar_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        ranking_position:
          type: [integer, "null"]
          description: Posición en el ranking, o null si el club no tiene partidos en ligas públicas.
        points:
          type: integer
        matches_played:
          type: integer
        won:
          type: integer
        won_penalties:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goals_for:
          type: integer
        goals_against:
          type: integer

    ChangeCoachInput:
      type: object
      required: [behavior_id]
      properties:
        behavior_id:
          type: [string, "null"]
          format: uuid
          description: Comportamiento propio de tipo DT, o null para quedar sin DT.

    # --- Jugadores ---
    CreatePlayerInput:
      type: object
      required: [name, number, power, agility, control, speed, strength]
      description: La suma de los 5 atributos debe ser exactamente 300.
      properties:
        name:
          type: string
        number:
          type: integer
          minimum: 1
          maximum: 99
        power:
          type: integer
          minimum: 20
          maximum: 100
        agility:
          type: integer
          minimum: 20
          maximum: 100
        control:
          type: integer
          minimum: 20
          maximum: 100
        speed:
          type: integer
          minimum: 20
          maximum: 100
        strength:
          type: integer
          minimum: 20
          maximum: 100

    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: integer
        power:
          type: integer
        agility:
          type: integer
        control:
          type: integer
        speed:
          type: integer
        strength:
          type: integer
    
    # --- Comportamientos ---
    CreateBehaviorInput:
      type: object
      required: [name, code, kind]
      properties:
        name:
          type: string
          description: De 1 a 30 caracteres. Único entre los comportamientos del club.
        code:
          type: string
          description: |
              Código del comportamiento en Python. Se debe verificar. Ver las primitivas válidas en la especificación de la API de comportamientos
        kind:
          type: string
          enum: [player, coach]
          description: player si define decide_action (jugador); coach si define decide_coach (DT).

    UpdateBehaviorInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          description: De 1 a 30 caracteres. Único entre los comportamientos del club.
        code:
          type: string
          description: Código nuevo. Se valida con el tipo (kind) que ya tiene el comportamiento.

    Behavior:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        kind:
          type: string
          enum: [player, coach]

    BehaviorTestInput:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Comportamiento de jugador a probar. No se guarda.

    BehaviorTestResponse:
      type: object
      properties:
        match_id:
          type: string
          format: uuid
          description: Id del partido de prueba, para conectarse a /ws/matches/{match_id}.
    
    # --- Ligas ---
    CreateLeagueInput:
      type: object
      required: [name, max_clubs, match_duration_minutes, formation, players]
      properties:
        name:
          type: string
        password:
          type: [string, "null"]
        max_clubs:
          type: integer
          minimum: 3
          maximum: 20
        match_duration_minutes:
          type: integer
        allows_draws:
          type: boolean
          default: true
          description: false crea una liga sin empates, en la que un partido igualado se define por penales (3 puntos al ganador en el tiempo de juego, 2 al ganador por penales y 0 al perdedor).
        formation:
          description: Formación con la que el club creador arranca la liga
          $ref: '#/components/schemas/FormationPreset'
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'
    
    LeagueSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_private:
          type: boolean
        max_clubs:
          type: integer
        status:
          type: string
          enum: [not_started, started, finished, cancelled]
        club_count:
          type: integer
          description: Cantidad de clubes actualmente inscriptos.

    LeagueDetail:
      type: object
      properties: 
        id:
          type: string
          format: uuid
        name:
          type: string
        is_private:
          type: boolean
          description: derivado de si la liga tiene password
        max_clubs:
          type: integer
        status:
          type: string
          enum: [not_started, started, finished, cancelled]
        creator_club_id:
          type: string
          format: uuid
        match_duration_minutes:
          type: integer
        allows_draws:
          type: boolean
        current_round:
          type: [integer, "null"]
          description: Fecha en juego, null si la liga no está iniciada.
        registered_clubs:
          type: array
          description: Clubes actualmente inscriptos en la liga.
          items:
            type: object
            properties:
              club_id:
                type: string
                format: uuid
              club_name:
                type: string
    
    SquadPlayerInput:
      type: object
      required: [player_id, is_starter]
      properties:
        player_id:
          type: string
          format: uuid
        is_starter:
          type: boolean
          description: true si arranca jugando; false si queda en el banco.
        behavior_id:
          type: [string, "null"]
          format: uuid
          description: Comportamiento que usará el jugador durante el partido. Obligatorio si is_starter es true. Para suplentes, se define recién al sustituirlos (ver substitution_behavior_id en POST /matches/{match_id}/substitutions); hasta entonces puede ser null.

    JoinLeagueInput:
      type: object
      required: [formation, players]
      properties:
        password:
          type: string
        formation:
          description: Formación con la que el club arranca la liga
          $ref: '#/components/schemas/FormationPreset'
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'

    StandingsItem:
      type: object
      properties:
        club_id:
          type: string
          format: uuid
        club_name:
          type: string
        points:
          type: integer
        matches_played:
          type: integer
        won:
          type: integer
        won_penalties:
          type: integer
          description: Partidos ganados por penales (solo en ligas sin empates). No se cuentan en won.
        drawn:
          type: integer
        lost:
          type: integer
        goals_for:
          type: integer
        goals_against:
          type: integer
      
    # --- Amistosos ---
    CreateFriendlyInput:
      type: object
      required: [formation, players]
      properties:
        password:
          type: string
          description: Si se provee, el amistoso será privado.
        formation:
          description: Formación con la que el club creador juega el amistoso
          $ref: '#/components/schemas/FormationPreset'
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'
            
    JoinFriendlyInput:
      type: object
      required: [formation, players]
      properties:
        password:
          type: string
          description: Requerido si el amistoso es privado.
        formation:
          description: Formación con la que el club que se une juega el amistoso
          $ref: '#/components/schemas/FormationPreset'
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'

    Friendly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creator_club_id:
          type: string
          format: uuid
        creator_club_name:
          type: string
        rival_club_id:
          type: [string, "null"]
          format: uuid
        is_private:
          type: boolean
        status:
          type: string
          enum: [waiting_for_rival, accepted, cancelled]
        match_id:
          type: [string, "null"]
          format: uuid

    # --- Partidos ---
    MatchStatus:
      type: string
      enum: [scheduled, in_progress, paused, finished]

    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        league_id:
          type: [string, "null"]
          format: uuid
          description: null si es un amistoso.
        round:
          type: [integer, "null"]
          description: Fecha de la liga. null si es un amistoso.
        home_club_id:
          type: string
          format: uuid
        home_club_name:
          type: string
        away_club_id:
          type: string
          format: uuid
        away_club_name:
          type: string
        status:
          $ref: '#/components/schemas/MatchStatus'
        starts_at:
          type: [string, "null"]
          format: date-time
          description: Hora de inicio programada. null mientras la fecha todavía no tiene hora.
        home_score:
          type: [integer, "null"]
        away_score:
          type: [integer, "null"]
        home_penalties:
          type: [integer, "null"]
          description: Penales convertidos en la tanda. null si el partido no se definió por penales.
        away_penalties:
          type: [integer, "null"]
          description: Penales convertidos en la tanda. null si el partido no se definió por penales.

    SubmitLineupInput:
      type: object
      description: Alineación de un club en una liga. Los jugadores tienen que ser los 6 convocados del club en esa liga.
      required: [formation, players]
      properties:
        formation:
          description: Formación con la que el club juega desde el próximo partido
          $ref: '#/components/schemas/FormationPreset'
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'

    ScheduleSubstitutionInput:
      type: object
      required: [player_out_id, player_in_id, substitution_behavior_id]
      properties:
        player_out_id:
          type: string
          format: uuid
        player_in_id:
          type: string
          format: uuid
        substitution_behavior_id:
          type: string
          format: uuid
    
    Substitution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        player_out_id:
          type: string
          format: uuid
        player_in_id:
          type: string
          format: uuid
        window:
          type: string
          enum: [cooling_break_1, halftime, cooling_break_2]
        status:
          type: string
          enum: [pending, executed, cancelled]
      
    PenaltyOrderInput:
      type: object
      required: [kickers]
      properties:
        kickers:
          type: array
          minItems: 5
          maxItems: 5
          description: Los 5 pateadores en orden, sin repetir, elegidos entre los 6 convocados del club.
          items:
            type: object
            required: [player_id, behavior_id]
            properties:
              player_id:
                type: string
                format: uuid
              behavior_id:
                type: string
                format: uuid

    # --- Ranking ---
    RankingItem:
      type: object
      properties:
        position:
          type: integer
        club_id:
          type: string
          format: uuid
        club_name:
          type: string
        avatar_url:
          type: string
          format: uri
        points:
          type: integer
        matches_played:
          type: integer
        won:
          type: integer
        won_penalties:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goals_for:
          type: integer
        goals_against:
          type: integer

    # --- Notificaciones ---
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
          description: 'Por ejemplo "Terminó tu partido de la liga X: A 2 - 1 B" o "Terminó la liga X. Quedaste en el puesto N".'
        league_id:
          type: [string, "null"]
          format: uuid
          description: Liga a la que se refiere la notificación.
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
