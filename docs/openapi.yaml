openapi: 3.1.0
info:
  title: FutBot API
  version: 1.0.1
  description: API REST para la plataforma FutBot:\ Gestion de usuarios, jugadores, partidos, ligas, comportamientos en Python y datos del ranking
servers:
  - url: https://localhost:8000
    description: Entorno de desarrollo local

tags:
  - name: Authentication
  - name: User
  - name: Club
  - name: Players
  - name: Behaviors
  - name: Leagues
  - name: Friendlies
  - name: Match
  - name: Ranking

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Autenticación y Usuario
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentication]
      summary: Registrar Usuario
      description: Crea la cuenta de usuario. El club se crea en un paso separado (POST /club) inmediatamente después, dentro del mismo flujo de onboarding del cliente.
      operationId: register_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesion
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar sesión
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/password:
    patch:
      tags: [User]
      summary: Modificar contraseña
      operationId: change_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: La contraseña actual es incorrecta, o la nueva coincide con la actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ---------------------------------------------------------------------------
  # Club
  # ---------------------------------------------------------------------------
  /club:
    post:
      tags: [Club]
      summary: Crear club (segundo paso del registro)
      operationId: create_club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClubInput'
      responses:
        '201':
          description: Club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          description: Falta alguno de los dos campos o las entradas son inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':  
          description: El usuario ya tiene un club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Club]
      summary: Obtener mi club
      operationId: get_my_club 
      description: Identifica al club mediante el token de sesión.
      responses:
        '200':
          description: Datos del club propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /club/avatar:
    patch:
      tags: [Club]
      summary: Cambiar avatar del club
      operationId: change_avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAvatarInput'
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
           $ref: '#/components/responses/Unauthorized'

  /club/formation:
    patch:
      tags: [Club]
      summary: Cambiar formación default del club
      operationId: change_default_formation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDefaultFormationInput'
      responses:
        '200':
          description: Formación default actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /club/history:
    get:
      tags: [Club]
      summary: Ver historial de partidos de mi club
      operationId: get_my_history
      responses:
        '200':
          description: Historial de partidos jugados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /clubs/{club_id}/history:
    parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Club]
      summary: Ver historial compartido con otro club
      description: Historial de partidos jugados entre el club del usuario autenticado y el club indicado.
      operationId: get_shared_history
      responses:
        '200':
          description: Historial de partidos entre ambos clubes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
        '400':
          description: No se puede consultar el historial compartido con el propio club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{club_id}:
    get:
      tags: [Club]
      summary: Ver club de un usuario
      operationId: get_club
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos públicos del club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' 


  # ---------------------------------------------------------------------------
  # Jugadores
  # ---------------------------------------------------------------------------
  /club/players:
    post:
      tags: [Players]
      summary: Crear jugador
      description: Crea un nuevo jugador en el club del usuario. Notar que la suma de sus PACSS debe ser exactamente 300.
      operationId: create_player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerInput'
      responses:
        '201':
          description: Jugador creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          description: El número de camiseta de jugdor está fuera de rango (1-99), la suma de los PACSS no es 300, o alguno está fuera de rango (20-100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El número de camiseta de jugdor está en uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        
    get:
      tags: [Players]
      summary: Listar jugadores del club
      operationId: list_my_players
      responses:
        '200':
          description: Plantilla completa del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
        '401':
           $ref: '#/components/responses/Unauthorized'

  /club/players/{player_id}:
    parameters:
      - name: player_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Players]
      summary: Obtener jugador
      operationId: get_my_player
      responses:
        '200':
          description: Datos del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Players]
      summary: Eliminar jugador
      operationId: delete_player
      responses:
        '200':
          description: Jugador eliminado
        '401':
           $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El jugador está participando en una liga activa o un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  


# ----------------------------------------------------------------------------- 
# Comportamiento
# -----------------------------------------------------------------------------
  /club/behaviors:
    post:
      tags: [Behaviors]
      summary: Crear nuevo Comportamiento
      operationId: create_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBehaviorInput'
      responses:
        '201':
          description: Comportamiento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '400':
          description: El código contiene errores de sintaxis o instrucciones prohibidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Nombre de comportamiento duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Behaviors]
      summary: Listar comportamientos guardados
      operationId: list_behaviors
      responses:
        '200':
          description: Comportamientos disponibles (OK)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Behavior'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /club/behaviors/{behavior_id}:
    parameters:
      - name: behavior_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Behaviors]
      summary: Obtener comportamiento por id
      operationId: get_behavior
      responses:
        '200':
          description: Detalle del comportamiento (OK)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Behaviors]
      summary: Editar comportamiento
      operationId: update_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBehaviorInput'
      responses:
        '200':
          description: Comportamiento editado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '400':
          description: El código contiene errores de sintaxis o instrucciones prohibidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El comportamiento está en uso por un jugador en un partido en curso, o el nuevo nombre ya está en uso por otro comportamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Behaviors]
      summary: Eliminar comportamiento
      operationId: delete_behavior
      responses:
        '200':
          description: Comportamiento eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El comportamiento está en uso por un jugador en un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


# -----------------------------------------------------------------------------
# Ligas
# -----------------------------------------------------------------------------
  /leagues:
    post:
      tags: [Leagues]
      summary: Crear liga
      description: Notar que la cantidad de clubes tiene un mínimo duro de 3. Si se envía password, la liga se considera privada.
      operationId: create_league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeagueInput'
      responses:
        '201':
          description: Liga creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
        '400':
          description: max_clubs excede el límite del sistema o no se enviaron enviaron exactamente 3 titulares (con sus comportamientos) y 3 suplentes en players
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Leagues]
      summary: Listar ligas
      description: Devuelve tanto ligas públicas como privadas. Solo no iniciadas
      operationId: list_leagues
      responses:
        '200':
          description: Ligas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /club/leagues:
    get:
      tags: [Leagues]
      summary: Listar ligas de mi club
      description: Identifica al club mediante el token de sesión. Devuelve las ligas en las que el club está inscripto.
      operationId: list_my_leagues
      responses:
        '200':
          description: Ligas en las que participa mi club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leagues/{league_id}:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Obtener detalle de una liga
      operationId: get_league
      responses:
        '200':
          description: Datos de la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Leagues]
      summary: Cancelar liga
      description: Solo el creador puede cancelarla, y solo si no está iniciada.
      operationId: cancel_league
      responses:
        '200':
          description: Liga cancelada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga ya se encuentra iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /leagues/{league_id}/join:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Leagues]
      summary: Unirse a una liga
      description: Reserva un cupo para la liga. Se definen 6 jugadores convocados para toda la liga (3 marcados como titulares por defecto, 3 como suplentes). Los titulares enviados se usan como fallback si el club no define la alineación antes de alguno de sus partidos.
      operationId: join_league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinLeagueInput'
      responses:
        '200':
          description: Inscripción registrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: La contraseña de la liga privada es incorrecta, no hay cupo, o no se enviaron exactamente 3 titulares y 3 suplentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El club ya está inscripto en esta liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Leagues]
      summary: Abandonar liga
      operationId: leave_league
      responses:
        '200':
          description: Inscripción eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La liga indicada no existe, o el club no está inscripto en ella
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La liga ya se encuentra iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /leagues/{league_id}/start:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Leagues]
      summary: Iniciar liga
      description: Solo el creador puede iniciarla. Cambia el estado a "started" y genera el fixture.
      operationId: start_league
      responses:
        '200':
          description: Liga iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
        '400':
          description: No hay suficientes clubes inscriptos para iniciar la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga ya se encuentra iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /leagues/{league_id}/matches:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Listar partidos de una liga
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, finished]
      operationId: list_league_matches
      responses:
        '200':
          description: Partidos de la liga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga aún no fue iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /leagues/{league_id}/standings:
    parameters:
      - name: league_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Tabla de posiciones
      operationId: get_standings
      responses:
        '200':
          description: Tabla de posiciones de la liga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingsItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La liga aún no fue iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# -----------------------------------------------------------------------------
# Amistosos
# -----------------------------------------------------------------------------
  /friendlies:
    get:
      tags: [Friendlies]
      summary: Listar amistosos
      description: Devuelve una lista de amistosos que están esperando rival, incluyendo públicos y privados.
      operationId: list_friendlies
      responses:
        '200':
          description: Lista de amistosos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friendly'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags: [Friendlies]
      summary: Crear amistoso
      description: Crea un amistoso esperando por un rival. Si se envía password, el amistoso se marca como privado.
      operationId: create_friendly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendlyInput'
      responses:
        '201':
          description: Amistoso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friendly'
        '400':
          description: No se enviaron exactamente 3 titulares y 3 suplentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friendlies/{friendly_id}/join:
    parameters:
      - name: friendly_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Friendlies]
      summary: Unirse a un amistoso
      description: Se une a un amistoso creado por otro club. Si es privado, requiere la contraseña. Al unirse exitosamente, se genera el partido.
      operationId: join_friendly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinFriendlyInput'
      responses:
        '200':
          description: Unido al amistoso exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friendly'
        '400':
          description: Contraseña incorrecta o no se enviaron exactamente 3 titulares y 3 suplentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El amistoso ya no está disponible (ya tiene rival o fue cancelado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /friendlies/{friendly_id}:
    parameters:
      - name: friendly_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Friendlies]
      summary: Cancelar amistoso
      description: Solo el club creador puede cancelarlo, y solo si aún no se ha unido ningún rival.
      operationId: cancel_friendly
      responses:
        '200':
          description: Amistoso cancelado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El amistoso ya tiene un rival y no puede ser cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


# -----------------------------------------------------------------------------
# Partidos
# -----------------------------------------------------------------------------
  /matches/{match_id}:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Match]
      summary: Obtener detalle de un partido
      description: Devuelve la información actualizada de un partido específico, incluyendo su estado y resultado actual.
      operationId: get_match
      responses:
        '200':
          description: Detalle del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /matches/{match_id}/lineup:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Match]
      summary: Definir nuevos titulares, sus comportamientos y la formación antes de jugar el partido.
      description: Ventana de 30 segundos antes de cada partido (liga y amistoso). Los jugadores incluidos deben pertenecer al pool de convocados de la inscripción (liga) o el desafío/búsqueda (amistoso) correspondiente. Si no se completa a tiempo, el sistema asigna automáticamente los titulares/suplentes por defecto enviados al momento de inscribirse, los 3 comportamientos asignados a los jugadores por defecto, y la formación default del club.
      operationId: set_lineup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLineupInput'
      responses:
        '200':
          description: Alineación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Alguno de los jugadores no pertenece al pool de convocados, o no se enviaron exactamente 3 titulares y 3 suplentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        
  /matches/{match_id}/players/{player_id}:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: player_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Match]
      summary: Cambiar comportamiento en vivo
      description: Se aplica desde el siguiente tick del simulador.
      operationId: change_live_behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [behavior_id]
              properties:
                behavior_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Comportamiento actualizado
        '400':
          description: El comportamiento seleccionado fue eliminado o es inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El partido o el jugador indicado no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /matches/{match_id}/substitutions:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Match]
      summary: Programar sustitución
      description: Se agenda para la próxima ventana disponible (pausa de hidratación o entretiempo). Solo puede haber una sustitución pendiente por club a la vez.
      operationId: schedule_substitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSubstitutionInput'
      responses:
        '201':
          description: Sustitución programada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Substitution'
        '400':
          description: El jugador saliente no es titular actual, el jugador entrante no es suplente o no pertenecen a los 6 convocados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya se agotaron los 3 cambios permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Match]
      summary: Desprogramar sustitución
      description: Cancela la sustitución pendiente del club antes de que se alcance la ventana de cambio.
      operationId: unschedule_substitution
      responses:
        '200':
          description: Sustitución cancelada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No hay ninguna sustitución pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# -----------------------------------------------------------------------------
# Ranking
# -----------------------------------------------------------------------------
  /ranking:
    get:
      tags: [Ranking]
      summary: Ver ranking global
      description: Calculado a partir de los partidos jugados en instancias públicas (ligas públicas y amistosos).
      operationId: get_ranking
      responses:
        '200':
          description: Ranking mundial
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No se proporcionó un token, o el token es inválido o expiró
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El usuario no tiene permisos para realizar esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # -- Autenticación / Usuario ---
    UserRegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    
    AuthResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
        
  
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    
    # User:
    #   type: object
    #   required: [id, username, email, password]
    #   properties:
    #     id:
    #       type: string
    #       format: uuid
    #     email:
    #       type: string
    #     password:
    #       type: string
    
    # --- Club ---
    CreateClubInput:
      type: object
      required: [club_name, avatar_url]
      properties:
        club_name:
          type: string
        avatar_url:
          type: string
          format: uri
          description: URL pública de la imagen/avatar del club.

    ChangeAvatarInput:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          format: uri

    FormationPreset:
      type: string
      enum: [TRIANGLE, OFFENSIVE_LINE, DEFENSIVE, DIAGONAL] # puede cambiar
      description: Formaciones predefinidas por el sistema.
    
    ChangeDefaultFormationInput:
      type: object
      required: [default_formation]
      properties:
        default_formation:
          $ref: '#/components/schemas/FormationPreset'

    HistoryItem:
      type: object
      properties:
        match_id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        rival_club_id:
          type: string
          format: uuid
        rival_club_name:
          type: string
        own_score:
          type: integer
        rival_score:
          type: integer
        result:
          type: string
          enum: [won, lost, drawn]
    
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
        club_name:
          type: string
        avatar_url:
          type: string
          format: uri
        default_formation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    # --- Jugadores ---
    CreatePlayerInput:
      type: object
      required: [name, number, power, agility, control, speed, strength]
      description: La suma de los 5 atributos debe ser exactamente 300.
      properties:
        name:
          type: string
        number:
          type: integer
          minimum: 1
          maximum: 99
        power:
          type: integer
          minimum: 20
          maximum: 100
        agility:
          type: integer
          minimum: 20
          maximum: 100
        control:
          type: integer
          minimum: 20
          maximum: 100
        speed:
          type: integer
          minimum: 20
          maximum: 100
        strength:
          type: integer
          minimum: 20
          maximum: 100

    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: integer
        power:
          type: integer
        agility:
          type: integer
        control:
          type: integer
        speed:
          type: integer
        strength:
          type: integer
    
    # --- Comportamientos ---
    CreateBehaviorInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
          description: |
              Código del comportamiento en Python. Se debe verificar. Ver las primitivas válidas en la especificación de la API de comportamientos

    Behavior:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
    
    # --- Ligas ---
    CreateLeagueInput:
      type: object
      required: [name, max_clubs, match_duration_minutes, players]
      properties:
        name:
          type: string
        password:
          type: [string, "null"]
        max_clubs:
          type: integer
          minimum: 3
          maximum: 30
        match_duration_minutes:
          type: integer
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'
    
    LeagueSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_private:
          type: boolean
        max_clubs:
          type: integer
        status:
          type: string
          enum: [not_started, started, finished]
        club_count:
          type: integer
          description: Cantidad de clubes actualmente inscriptos.

    LeagueDetail:
      type: object
      properties: 
        id:
          type: string
          format: uuid
        name:
          type: string
        is_private:
          type: boolean
          description: derivado de si la liga tiene password
        max_clubs:
          type: integer
        status:
          type: string
          enum: [not_started, started, finished]
        registered_clubs:
          type: array
          description: Clubes actualmente inscriptos en la liga.
          items:
            type: object
            properties:
              club_id:
                type: string
                format: uuid
              club_name:
                type: string
    
    SquadPlayerInput:
      type: object
      required: [player_id, is_starter]
      properties:
        player_id:
          type: string
          format: uuid
        is_starter:
          type: boolean
          description: true si arranca jugando; false si queda en el banco.
        behavior_id:
          type: [string, "null"]
          format: uuid
          description: Comportamiento que usará el jugador durante el partido. Obligatorio si is_starter es true. Para suplentes, se define recién al sustituirlos (ver substitution_behavior_id en POST /matches/{match_id}/substitutions); hasta entonces puede ser null.

    JoinLeagueInput:
      type: object
      required: [players]
      properties:
        password:
          type: string
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'

    StandingsItem:
      type: object
      properties:
        club_id:
          type: string
          format: uuid
        club_name:
          type: string
        points:
          type: integer
        matches_played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goals_for:
          type: integer
        goals_against:
          type: integer
      
    # --- Amistosos ---
    CreateFriendlyInput:
      type: object
      required: [players]
      properties:
        password:
          type: string
          description: Si se provee, el amistoso será privado.
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'
            
    JoinFriendlyInput:
      type: object
      required: [players]
      properties:
        password:
          type: string
          description: Requerido si el amistoso es privado.
        players:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con is_starter en true y 3 en false.
          items:
            $ref: '#/components/schemas/SquadPlayerInput'

    Friendly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creator_club_id:
          type: string
          format: uuid
        rival_club_id:
          type: [string, "null"]
          format: uuid
        is_private:
          type: boolean
        status:
          type: string
          enum: [waiting_for_rival, accepted, cancelled]
        match_id:
          type: [string, "null"]
          format: uuid

    # --- Partidos ---
    MatchStatus:
      type: string
      enum: [in_progress, paused, finished]

    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        home_club_id:
          type: string
          format: uuid
        away_club_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/MatchStatus'
        home_score:
          type: [integer, "null"]
        away_score:
          type: [integer, "null"]

    SubmitLineupInput:
      type: object
      required: [formation, starters, substitutes]
      properties:
        formation:
          $ref: '#/components/schemas/FormationPreset'
        starters:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [player_id, behavior_id]
            properties:
              player_id:
                type: string
                format: uuid
              behavior_id:
                type: string
                format: uuid
        substitutes:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [player_id]
            properties:
              player_id:
                type: string
                format: uuid
    
    ScheduleSubstitutionInput:
      type: object
      required: [player_out_id, player_in_id, substitution_behavior_id]
      properties:
        player_out_id:
          type: string
          format: uuid
        player_in_id:
          type: string
          format: uuid
        substitution_behavior_id:
          type: string
          format: uuid
    
    Substitution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        player_out_id:
          type: string
          format: uuid
        player_in_id:
          type: string
          format: uuid
        window:
          type: string
          enum: [cooling_break_1, halftime, cooling_break_2]
        status:
          type: string
          enum: [pending, executed, cancelled]
      
    # --- Ranking ---
    RankingItem:
      type: object
      properties:
        position:
          type: integer
        club_id:
          type: string
          format: uuid
        club_name:
          type: string
        points:
          type: integer
